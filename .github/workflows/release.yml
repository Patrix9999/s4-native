
name: release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Create placeholders for generated crates
        shell: bash
        run: |
          for d in s4/lifted/*/; do
            [[ -f "$d/Cargo.toml" && ! -f "$d/src/lib.rs" ]] || continue
            mkdir -p "$d/src"
            printf '%s\n' \
              'pub fn dispatch(_c: &mut s4_x86::Cpu, _addr: u32) -> bool { false }' \
              > "$d/src/lib.rs"
          done

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libasound2-dev \
            pkg-config

      - name: Build executable
        run: cargo build --release --target ${{ matrix.target }} -p s4-play

      - name: Package Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/${{ matrix.target }}/release/s4-play dist/s4-play
          chmod +x dist/s4-play
          tar -C dist -czf s4-play-linux-x86_64.tar.gz s4-play

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cp target/${{ matrix.target }}/release/s4-play.exe \
            s4-play-windows-x86_64.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            s4-play-linux-x86_64.tar.gz
            s4-play-windows-x86_64.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/s4-play-linux-x86_64.tar.gz
            dist/s4-play-windows-x86_64.exe
